services:
  postgresSQL:
    image: postgres:16-alpine
    container_name: DB_Server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./postgres_data:/var/lib/postgresql:z
      - ./databases/:/docker-entrypoint-initdb.d:ro,z
    networks:
      - server_net

  nextcloud:
    image: nextcloud:stable
    container_name: nextcloud_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgresSQL
    environment:
      - POSTGRES_HOST=postgresSQL
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 nextcloud.local
    volumes:
      - ./nextcloud_data:/var/www/html:z
    # Mantenha as demais configurações existentes.
    networks:
      server_net:
        aliases:
          - nextcloud.local

  nextcloud-cron:
    image: nextcloud:stable
    restart: unless-stopped
    volumes:
      - ./nextcloud_data:/var/www/html:z
    entrypoint: /cron.sh
    depends_on:
      - postgresSQL
    networks:
      - server_net

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_app
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.local
      - WEBHOOK_URL=http://n8n.local/
      - N8N_SECURE_COOKIE=false # <- Adicione esta linha
    volumes:
      - ./n8n_data:/home/node/.n8n:z
    networks:
      - server_net

  collabora:
    image: collabora/code:latest
    container_name: collabora_app
    restart: unless-stopped

    environment:
      - server_name=collabora.local
      - aliasgroup1=http://nextcloud.local:80
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false

    cap_add:
      - MKNOD

    networks:
      - server_net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:z

    networks:
      server_net:
        aliases:
          - collabora.local

networks:
  server_net:
    driver: bridge